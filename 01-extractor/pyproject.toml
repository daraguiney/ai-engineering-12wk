[project]
name = "extractor"
version = "0.1.0"
description = "Typed LLM extractor for arXiv papers"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "instructor>=1.7", "pydantic>=2.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

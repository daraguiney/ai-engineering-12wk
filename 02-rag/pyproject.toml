[project]
name = "rag"
version = "0.1.0"
description = "Cited Q&A over arXiv papers: LanceDB baseline and measured retrieval upgrades"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastembed>=0.9.1",
    "instructor>=1.17.0",
    "lancedb>=0.41.0",
    "pydantic>=2.8",
    "pymupdf>=2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

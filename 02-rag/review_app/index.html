<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review: retrieval test set</title>
<style>
  :root { --bg:#fafaf8; --card:#fff; --ink:#1d1d1b; --mute:#6b6b66; --line:#e3e3de;
          --ok:#1f7a4d; --fix:#b7791f; --drop:#b83232; --accent:#2b5fd9; --quote:#f3f1ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --card:#202024; --ink:#ececea; --mute:#9a9a94; --line:#33333a;
            --ok:#4cc38a; --fix:#e0a847; --drop:#ef6b6b; --accent:#7b9dff; --quote:#2a2a30; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:14px 18px 40px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h1 { font-size:15px; margin:0; font-weight:600; color:var(--mute); letter-spacing:.02em; }
  .progress { font-size:14px; color:var(--mute); }
  .bar { height:6px; background:var(--line); border-radius:3px; margin:8px 0 10px; overflow:hidden; }
  .bar > div { height:100%; background:var(--ok); width:0; transition:width .2s; }
  .dots { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px; }
  .dots button { width:26px; height:26px; padding:0; border-radius:6px; border:1px solid var(--line);
                 background:var(--card); color:var(--mute); font-size:11px; cursor:pointer; }
  .dots button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  .dots button.fix { background:var(--fix); color:#fff; border-color:var(--fix); }
  .dots button.drop { background:var(--drop); color:#fff; border-color:var(--drop); }
  .dots button.cur { outline:2px solid var(--accent); outline-offset:1px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  .meta { display:flex; gap:8px; align-items:center; margin-bottom:10px; font-size:13px; color:var(--mute); }
  .chip { padding:2px 9px; border-radius:999px; border:1px solid var(--line); font-weight:600; }
  .chip.cross { color:var(--accent); } .chip.unanswerable { color:var(--fix); }
  .q { font-size:21px; line-height:1.4; font-weight:600; margin:0 0 16px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--mute); margin:16px 0 6px; }
  .ev { margin:0 0 10px; }
  .ev .src { font-size:13px; color:var(--mute); margin-bottom:3px; }
  blockquote { margin:0; background:var(--quote); border-left:3px solid var(--accent); padding:10px 14px;
               border-radius:0 8px 8px 0; font-size:16px; }
  .answer { padding:10px 14px; border:1px dashed var(--line); border-radius:8px; }
  .trap { background:var(--quote); border:1px solid var(--fix); border-radius:8px; padding:12px 14px; font-size:15.5px; }
  .verdicts { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0 10px; }
  .verdicts button { padding:12px 6px; font-size:16px; font-weight:600; border-radius:10px; cursor:pointer;
                     border:2px solid var(--line); background:var(--card); color:var(--ink); }
  .verdicts button small { display:block; font-weight:400; font-size:12px; color:var(--mute); }
  .verdicts button.sel.ok { border-color:var(--ok); background:var(--ok); color:#fff; }
  .verdicts button.sel.fix { border-color:var(--fix); background:var(--fix); color:#fff; }
  .verdicts button.sel.drop { border-color:var(--drop); background:var(--drop); color:#fff; }
  .verdicts button.sel small { color:#ffffffcc; }
  textarea { width:100%; min-height:64px; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
             background:var(--card); color:var(--ink); font:inherit; font-size:15px; resize:vertical; }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px; }
  .nav button { padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card);
                color:var(--ink); font-size:15px; cursor:pointer; }
  .hint { font-size:12px; color:var(--mute); text-align:center; }
  .status { font-size:12px; color:var(--mute); min-height:16px; }
  .err { color:var(--drop); }
  .done { text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<main>
  <header><h1>RETRIEVAL TEST SET · REVIEW</h1><div class="progress" id="progress"></div></header>
  <div class="bar"><div id="barfill"></div></div>
  <div class="dots" id="dots"></div>
  <div id="view"></div>
</main>
<script>
const VERDICTS = ["ok", "fix", "drop"];
const HELP = { ok:"keep as is", fix:"change it (say how)", drop:"remove" };
let state = null, idx = 0, saveTimer = null;

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load() {
  const res = await fetch("/api/state");
  state = await res.json();
  if (state.error) { el("view").innerHTML = `<p class="err">${esc(state.error)}</p>`; return; }
  const firstOpen = state.questions.findIndex((q) => !state.verdicts[q.id]);
  idx = firstOpen === -1 ? 0 : firstOpen;
  render();
}

function renderTop() {
  const done = Object.keys(state.verdicts).length, total = state.questions.length;
  el("progress").textContent = `${done} of ${total} reviewed`;
  el("barfill").style.width = `${(100 * done) / total}%`;
  el("dots").innerHTML = state.questions.map((q, i) => {
    const v = state.verdicts[q.id]?.verdict || "";
    return `<button class="${v} ${i === idx ? "cur" : ""}" data-i="${i}" title="${esc(q.id)}">${i + 1}</button>`;
  }).join("");
  el("dots").querySelectorAll("button").forEach((b) => b.onclick = () => go(+b.dataset.i));
}

function render() {
  renderTop();
  const q = state.questions[idx], saved = state.verdicts[q.id] || {};
  const trap = q.type === "unanswerable";
  const evidence = trap
    ? `<div class="trap"><strong>Trap question: no answer exists on purpose.</strong>
        This tests whether the system says "the papers don't say" instead of making something up.
        There is no quote to show.<br><br>
        <strong>Your job:</strong> do you agree that none of the 40 papers answers this?
        <b>OK</b> = yes, it is unanswerable (keep it). <b>DROP</b> or <b>FIX</b> = you think a paper does answer it (say which in the note).</div>`
    : q.evidence.map((e) => `<div class="ev"><div class="src">${esc(e.arxiv_id)} · ${esc(state.titles[e.arxiv_id] || "")}</div>
        <blockquote>${esc(e.quote)}</blockquote></div>`).join("");
  el("view").innerHTML = `<div class="card">
    <div class="meta"><span class="chip ${q.type}">${q.type}</span><span>${esc(q.id)} · ${idx + 1} / ${state.questions.length}</span></div>
    <p class="q">${esc(q.question)}</p>
    <h2>${trap ? "What to check" : q.evidence.length > 1 ? "Evidence (needs both)" : "Evidence"}</h2>${evidence}
    <h2>${trap ? "Why we think it is unanswerable" : "Expected answer"}</h2><div class="answer">${esc(q.notes)}</div>
    <div class="verdicts">${VERDICTS.map((v, i) => `<button class="${v} ${saved.verdict === v ? "sel" : ""}" data-v="${v}">
      ${v.toUpperCase()}<small>${i + 1} · ${HELP[v]}</small></button>`).join("")}</div>
    <textarea id="note" placeholder="Note (optional; say what to fix)">${esc(saved.note || "")}</textarea>
    <div class="status" id="status"></div>
  </div>
  <div class="nav"><button id="prev">← Prev</button>
    <span class="hint">1 ok · 2 fix · 3 drop · ← → move · n next unreviewed</span>
    <button id="next">Next →</button></div>`;
  el("view").querySelectorAll(".verdicts button").forEach((b) => b.onclick = () => setVerdict(b.dataset.v));
  el("note").oninput = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNote(), 600); };
  el("prev").onclick = () => go(idx - 1); el("next").onclick = () => go(idx + 1);
}

async function post(id, verdict, note) {
  const res = await fetch("/api/verdict", { method:"POST", headers:{ "Content-Type":"application/json" },
                                             body: JSON.stringify({ id, verdict, note }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  state.verdicts = data.verdicts;
}

async function setVerdict(verdict) {
  const q = state.questions[idx];
  try {
    await post(q.id, verdict, el("note").value);
    el("status").textContent = "Saved ✓";
    renderTop();
    el("view").querySelectorAll(".verdicts button").forEach((b) => b.classList.toggle("sel", b.dataset.v === verdict));
    if (verdict === "ok" && idx < state.questions.length - 1) setTimeout(() => go(idx + 1), 250);
  } catch (e) { el("status").innerHTML = `<span class="err">Not saved: ${esc(e.message)}</span>`; }
}

async function saveNote() {
  const q = state.questions[idx], v = state.verdicts[q.id];
  if (!v) { el("status").textContent = "Pick ok / fix / drop and the note saves with it."; return; }
  try { await post(q.id, v.verdict, el("note").value); el("status").textContent = "Saved ✓"; }
  catch (e) { el("status").innerHTML = `<span class="err">Not saved: ${esc(e.message)}</span>`; }
}

function go(i) {
  if (i < 0 || i >= state.questions.length) return;
  idx = i; render(); window.scrollTo(0, 0);
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey || !state) return;
  if (["1", "2", "3"].includes(e.key)) setVerdict(VERDICTS[+e.key - 1]);
  else if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "n") {
    const next = state.questions.findIndex((q, i) => i > idx && !state.verdicts[q.id]);
    go(next === -1 ? state.questions.findIndex((q) => !state.verdicts[q.id]) : next);
  }
});
load();
</script>
</body>
</html>
